name: Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build-1_20_1:
    name: Build MC 1.20.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 1.20.1
        run: ./gradlew build

      - name: Rename jar
        run: |
          cd build/libs
          for f in penguin-server-fabric-*.jar; do
            [ "$f" = "${f%-sources.jar}" ] && mv "$f" "${f%.jar}-mc1.20.1.jar"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-mc1.20.1
          path: build/libs/*-mc1.20.1.jar
          retention-days: 1

  build-26_2:
    name: Build MC 26.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mc26.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          early-access: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 26.2
        run: ./gradlew build

      - name: Rename jar
        run: |
          cd build/libs
          for f in penguin-server-fabric-*.jar; do
            [ "$f" = "${f%-sources.jar}" ] && mv "$f" "${f%.jar}-mc26.2.jar"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-mc26.2
          path: build/libs/*-mc26.2.jar
          retention-days: 1

  release:
    name: Create Release
    needs: [ build-1_20_1, build-26_2 ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download 1.20.1 jar
        uses: actions/download-artifact@v4
        with:
          name: jar-mc1.20.1
          path: artifacts

      - name: Download 26.2 jar
        uses: actions/download-artifact@v4
        with:
          name: jar-mc26.2
          path: artifacts

      - name: Get timestamp
        id: get-time
        run: echo "TIME=$(date -u +'%Y年%m月%d日 %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: PenguinClient-Fabric ${{ github.ref_name }}
          body: |
            ## 更新内容
            查看完整更新内容：[${{ github.ref_name }} commits](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }})

            ## 支持版本
            | 文件 | 适用 Minecraft 版本 |
            |------|-------------------|
            | `*-mc1.20.1.jar` | 1.20.1 ~ 1.21.x（需 Java 21+） |
            | `*-mc26.2.jar` | 26.1+（需 Java 25+） |

            ## 构建信息
            - 构建时间: ${{ steps.get-time.outputs.TIME }}
            - 提交哈希: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            artifacts/*.jar
